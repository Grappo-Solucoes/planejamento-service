# Exemplo de Secret — NÃO comite valores reais. Crie via `kubectl create secret` ou
# External Secrets/Sealed Secrets no pipeline. As chaves espelham as variáveis
# consumidas por src/main/resources/application.properties.
apiVersion: v1
kind: Secret
metadata:
  name: planejamento-service-secrets
  namespace: busco
  labels:
    app.kubernetes.io/name: planejamento-service
    app.kubernetes.io/part-of: busco
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "troque-me"
  RABBITMQ_PASS: "troque-me"
  # Segredo HS256 (BASE64URL) compartilhado com o busco-api; alternativa via JWT_ISSUER.
  JWT_SECRET: "troque-me"
  # JWT_ISSUER: "https://issuer.example.com"
