spring.application.name=planejamento-service

spring.flyway.enabled: true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#Spring DOC
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true

#DataBase
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.properties.hibernate.default_schema=agendamento

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# Tenant fixo da instalação (claim tenant_id do token tem precedência)
planejamento.tenant-id=${TENANT_ID:00000000-0000-0000-0000-000000000001}

# Outbox: poll a cada 5s, lote de 50, backoff exponencial entre tentativas
planejamento.outbox.poll-interval-ms=5000
planejamento.outbox.batch-size=50
planejamento.outbox.backoff-base-ms=5000
planejamento.outbox.backoff-max-ms=300000

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
# Sem habilitar explicitamente o export, o endpoint /actuator/prometheus nao e registrado (404).
management.prometheus.metrics.export.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.health.db.enabled=true

# JWT: aceita HS256 emitido pelo busco-api (segredo compartilhado, BASE64URL)
# ou issuer OAuth2 como opção por configuração
planejamento.jwt.secret=${JWT_SECRET:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:}


